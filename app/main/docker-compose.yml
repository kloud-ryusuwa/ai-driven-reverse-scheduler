services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    environment:
      WATCHPACK_POLLING: "true"
    command: npm run dev

volumes:
  node_modules:
  next_cache: